services:
  db:
    image: postgres:18.3
    # restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
